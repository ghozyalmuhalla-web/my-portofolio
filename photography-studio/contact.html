</head>
<body>
    <nav>
        <a href="index.html" class="logo">Lumina</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>

    <div class="page-container">
        <h1 class="page-title">Let's Create Together</h1>
        <div class="contact-wrapper">
            <div class="contact-info">
                <h3>Studio Details</h3>
                <p>📍 124 Art District, Creative Avenue<br>Metropolis, NY 10001</p>
                <p>📧 hello@luminastudio.com</p>
                <p>📞 +1 (555) 123-4567</p>
                <br>
                <h3>Follow Us</h3>
                <p>Instagram: @luminastudio</p>
                <p>Twitter: @lumina_photo</p>
            </div>
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for reaching out. We will get back to you shortly.');">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="text" placeholder="Subject / Project Type" required>
                <textarea placeholder="Tell us about your vision..." required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
